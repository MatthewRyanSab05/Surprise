<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To my Capybara</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Floating Background -->
    <div class="background"></div>

    <!-- Floating Sparkles -->
    <div id="sparkles"></div>

    <!-- Flowers -->
    <div id="flowers"></div>

    <!-- Capybaras -->
    <img src="assets/capy1.png" class="capy capy-left">

    <img src="assets/capy2.png" class="capy capy-right">

    <img src="assets/capy3.png" class="capy capy-up-right">

    <img src="assets/capy5.png" class="capy capy-up-left">

    <div id="speech">
        Welcome! ❤️ 
    </div>

    <!-- Intro -->
    <section id="intro">

        <h1>For My Favorite Capybara</h1>

        <p>For making me the happiest person, this is for u baby.</p>

        <div id="giftBox">
            <img src="assets/capy4.png" width="200px" height="200px">
        </div>

        <span>Click the capyybara babyy</span>

    </section>

    <!-- Main Content -->
    <main id="mainContent">

        <!-- Photo Section -->
        <section id="gallery">

            <h2>Our Little Memories</h2>

            <div id="photoContainer">

            </div>

        </section>

        <!-- Envelope -->
        <section id="envelopeSection">

            <div id="envelope">

                <div class="flap"></div>

                <div class="letterPeek">
                    💌
                </div>

            </div>

            <button id="openLetter">
                Open My Letter
            </button>

        </section>

        <!-- Letter -->
        <section id="letterSection" class="letter">

            <div class="paper">

                <h2>To Kylie,</h2>

                <p id="typedLetter"></p>

            </div>

        </section>

        <!-- Ending -->
        <section id="ending">

            <h1>I Love You, Kylie</h1>

            <p>From your IT Nerd</p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
